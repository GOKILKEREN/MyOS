name: WaShield Android APK

on:
  workflow_dispatch:
  push:
    branches: [washield-ci]
    paths:
      - 'WaShield/**'
      - '.github/workflows/build-washield.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: WaShield
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaShield-debug-apk
          path: WaShield/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
